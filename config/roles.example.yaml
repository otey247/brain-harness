# Copy to config/roles.yaml (gitignored) and set real model ids, or set
# BRAIN_MODEL (every role) / BRAIN_PLANNER_MODEL / BRAIN_SEARCHER_MODEL / BRAIN_WRITER_MODEL / BRAIN_JUDGE_MODEL.
# `brain models` prints what each role resolves to and any missing API key.
#
# Format: provider:model-id, as Pydantic AI reads it. Providers include:
#   claude: (same as anthropic:)   openai:   azure:   google-gla:   bedrock:   ollama:
# To use one gateway for every provider, run a LiteLLM proxy, set
# OPENAI_BASE_URL to it, and use openai:<proxy model alias> everywhere.

models:
  # Prompt caching for Claude: "5m" (default), "1h", or false.
  prompt_cache: "5m"

roles:
  planner:
    model: claude:YOUR-STRONG-MODEL
    fallbacks: [openai:YOUR-FALLBACK-MODEL]
  searcher:
    model: claude:YOUR-FAST-MODEL
  writer:
    model: claude:YOUR-STRONG-MODEL
  judge:
    model: openai:YOUR-JUDGE-MODEL   # a different family from the planner avoids self-preference
    # Per-role provider settings pass through unchanged, e.g.:
    # settings: {max_tokens: 4000}
