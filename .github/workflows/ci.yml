name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: sudo apt-get install -y ripgrep
      - run: uv sync --all-packages --all-extras --group dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run okf validate bundles/example --strict
