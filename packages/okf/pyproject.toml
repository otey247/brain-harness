[project]
name = "okf"
version = "0.1.0"
description = "Open Knowledge Format v0.3 reader, validator and writer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
write = ["ruamel.yaml>=0.18"]

[project.scripts]
okf = "okf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okf"]
